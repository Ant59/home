- name: NAS Setup
  hosts: nas.home.derham.me
  become: true
  vars:
    base_dir: /srv

  tasks:
    - name: Ensure the base directory exists
      ansible.builtin.file:
        path: /etc/terminfo/a/
        state: directory
        mode: "0755"

    - name: Copy terminfo
      ansible.builtin.copy:
        src: files/alacritty.terminfo
        dest: /etc/terminfo/a/alacritty
        owner: root
        group: root
        mode: "0644"

    - name: Mount the root partition
      ansible.posix.mount:
        src: UUID=6e3bd5f3-38e5-4055-a882-405fa52f8be3
        path: /
        fstype: ext4
        state: mounted

    - name: Mount the footage disk
      ansible.posix.mount:
        src: UUID=36ce0e8c-f7c5-476f-a706-d8ded1c467cf
        path: /mnt/footage
        fstype: ext4
        state: mounted

    # TODO: Add backup disk
    # - name: Mount the backup disk
    #   ansible.posix.mount:
    #     src: UUID=
    #     path: /mnt/backup
    #     fstype: ext4
    #     state: mounted

    - name: Install Step CLI
      ansible.builtin.include_role:
        name: maxhoesel.smallstep.step_cli
      vars:
        step_cli_version: "0.24.4"
      tags:
        - step

    - name: Bootstrap the hosts to trust the CA
      maxhoesel.smallstep.step_ca_bootstrap:
        ca_url: https://ca.home.derham.me
        fingerprint: "e0d6b8d064a2bb9adbaf327363a36f2f5233de3aa518fb9c0d9f83182e0b5a1c"
        install: true
      tags:
        - step

    - name: Install Podman
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
        - podman
        - podman-docker
      tags:
        - podman

    - name: Enable Podman socket
      ansible.builtin.systemd:
        name: podman.socket
        enabled: true
        state: started
      tags:
        - podman

    - name: Install Caddy
      ansible.builtin.include_role:
        name: caddy
        apply:
          tags:
            - caddy
      tags:
        - caddy

    - name: Install Mosquitto
      ansible.builtin.include_role:
        name: mosquitto
        apply:
          tags:
            - mosquitto
      tags:
        - mosquitto

    - name: Install OpenThread Border Router
      ansible.builtin.include_role:
        name: otbr
        apply:
          tags:
            - otbr
      tags:
        - otbr

    - name: Install Matter Server
      ansible.builtin.include_role:
        name: matter
        apply:
          tags:
            - matter
      tags:
        - matter

    - name: Install Frigate
      ansible.builtin.include_role:
        name: frigate
        apply:
          tags:
            - frigate
      tags:
        - frigate

    - name: Install Zigbee2MQTT
      ansible.builtin.include_role:
        name: zigbee2mqtt
        apply:
          tags:
            - zigbee2mqtt
      tags:
        - zigbee2mqtt

    - name: Install Z-Wave JS UI
      ansible.builtin.include_role:
        name: zwave-js-ui
        apply:
          tags:
            - zwave-js-ui
      tags:
        - zwave-js-ui

    - name: Install Home Assistant
      ansible.builtin.include_role:
        name: homeassistant
        apply:
          tags:
            - homeassistant
      tags:
        - homeassistant

    - name: Install Unifi
      ansible.builtin.include_role:
        name: unifi
        apply:
          tags:
            - unifi
      tags:
        - unifi

    - name: Install Homepage
      ansible.builtin.include_role:
        name: homepage
        apply:
          tags:
            - homepage
      tags:
        - homepage

    - name: Install Transmission
      ansible.builtin.include_role:
        name: transmission
        apply:
          tags:
            - transmission
      tags:
        - transmission
